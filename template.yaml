AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS SNS Fan-out notifications
 
Resources:
  OrderPlacedTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-order-placed-topic"
      
  InventoryQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-inventory-queue"
  
  InventorySubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref OrderPlacedTopic
      Protocol: sqs
      Endpoint: !GetAtt InventoryQueue.Arn
       
  InventoryQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: 
        - !Ref InventoryQueue
      PolicyDocument: 
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: 
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt InventoryQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref OrderPlacedTopic

  EmailFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.handler
      Runtime: nodejs24.x
      CodeUri: ./src
      Events:
        SNSTrigger:
          Type: SNS
          Properties:
            Topic: !Ref OrderPlacedTopic
             
  PremiumQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-premium-queue"
    
  PremiumQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref PremiumQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt PremiumQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref OrderPlacedTopic

  PremiumSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref OrderPlacedTopic
      Protocol: sqs
      Endpoint: !GetAtt PremiumQueue.Arn
      # 🎯 THE FILTER POLICY BLOCK
      FilterPolicy:
        type:
          - premium
    
Outputs:
  TopicArn:
    Description: Use this ARN to publish test messages via AWS CLI
    Value: !Ref OrderPlacedTopic
  QueueUrl:
    Description: Use this URL to read messages from the SQS Inventory Queue
    Value: !Ref InventoryQueue