AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS SNS Fan-out notifications
Resources:
  OrderPlacedTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName:
        Fn::Sub: ${AWS::StackName}-order-placed-topic
  InventoryQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName:
        Fn::Sub: ${AWS::StackName}-inventory-queue
  InventorySubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn:
        Ref: OrderPlacedTopic
      Protocol: sqs
      Endpoint:
        Fn::GetAtt:
        - InventoryQueue
        - Arn
  InventoryQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
      - Ref: InventoryQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: sns.amazonaws.com
          Action: sqs:SendMessage
          Resource:
            Fn::GetAtt:
            - InventoryQueue
            - Arn
          Condition:
            ArnEquals:
              aws:SourceArn:
                Ref: OrderPlacedTopic
  EmailFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.handler
      Runtime: nodejs24.x
      CodeUri: EmailFunction
      Events:
        SNSTrigger:
          Type: SNS
          Properties:
            Topic:
              Ref: OrderPlacedTopic
    Metadata:
      SamResourceId: EmailFunction
